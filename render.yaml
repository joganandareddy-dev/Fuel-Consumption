services:
  # Python Flask Backend Web Service
  - type: web
    name: fuel-consumption-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MYSQL_HOST
        value: localhost
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        value: ""
      - key: MYSQL_DB
        value: fuel_db

  # React Vite Frontend Static Site (Static sites are free by default on Render and must not specify a plan)
  - type: web
    name: fuel-consumption-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fuel-consumption-backend
          property: host
